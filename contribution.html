<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    button { padding: 6px 12px; font: inherit; cursor: pointer; }
    #contributor-student-id { margin: 16px 0; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>

  <button id="load-contributor">Show Contributor</button>

  <p id="contributor-student-id"></p>

  <a href="index.html">Back to Task Manager</a>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      const output = document.getElementById('contributor-student-id');
      try {
        const response = await fetch('contribution.json');
        if (!response.ok) throw new Error(response.status);
        const data = await response.json();
        output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
      } catch (err) {
        output.textContent = `Could not load contributor (${err.message})`;
      }
    });
  </script>
</body>
</html>
